{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}

<section class="auth-section">

    <div class="container">

        <div class="row justify-content-center">

            <div class="col-lg-5 col-md-7">

                <div class="auth-card">

                    <div class="text-center mb-4">

                        <div class="eyebrow mb-3">
                            Welcome back
                        </div>

                        <h1 class="auth-title">
                            Sign in to <em>Fieldnote.</em>
                        </h1>

                        <p class="auth-subtitle">
                            Continue reading thoughtful essays
                            and keep exploring new ideas.
                        </p>

                    </div>


                    <form method="POST">

                        {% csrf_token %}

                        {{ form|crispy }}

                        <button
                            type="submit"
                            class="btn-ink auth-button w-100 mt-3"
                        >
                            Sign in →
                        </button>

                    </form>


                    <div class="auth-footer">

                        <span>
                            Don't have an account?
                        </span>

                        <a href="{% url 'accounts:register' %}">
                            Create one
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}
